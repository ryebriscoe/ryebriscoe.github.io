<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}
    </title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0b0b'/><text x='2' y='12' font-family='monospace' font-size='11' fill='%235dcaa5'>%3E_</text></svg>"
    />
    {% seo %}
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">ariya-briscoe</a>
        {% include nav.html %}
      </div>
    </header>

    <main id="content">
      <div class="wrap">{{ content }}</div>
    </main>

    {% include footer.html %}
  </body>
</html>
