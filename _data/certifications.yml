# Certifications shown on /certifications/
#
# progress: whole number 0-100. Omit it entirely and no bar renders,
#   which is the right state for a certificate you have not started.
# status:   in_progress | planned | completed
# credential: only once earned. Replaces the progress bar with a
#   "View credential" link.
#
# To update progress, change one number here. Nothing else to touch.

